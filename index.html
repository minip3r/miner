<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>MINIP3R</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header>
  <div class="main-title"><strong>MINIP3R</strong></div>
  <div class="sub-title"><strong>3D MODEL (AR)</strong></div>
</header>

<!-- Model 1 -->
<div class="ar-section">
  <div class="head-title"><strong>Qynn</strong></div>
  <div class="sub-title">original character from minip3r</div>

 <model-viewer
      id="model1"
      src="2677.glb"
      ios-src="2677.usdz"
      ar
      ar-modes="scene-viewer webxr quick-look"
      camera-controls
      autoplay
      auto-rotate
      shadow-intensity="1"
      shadow-softness="1"
      environment-image="neutral"
      loading="eager"
      reveal="auto"
      style="width: 100%; height: 400px;">
  </model-viewer>

  <button onclick="triggerAR('model1')"><strong>Play AR</strong></button>
</div>

<!-- Model 2 -->
<div class="ar-section">
  <div class="head-title"><strong>MINIP3R</strong></div>
  <div class="sub-title">original character from minip3r</div>

<model-viewer
      id="model1"
      src="01.glb"
      ios-src="01.usdz"
      ar
      ar-modes="scene-viewer webxr quick-look"
      camera-controls
      autoplay
      auto-rotate
      shadow-intensity="1"
      shadow-softness="1"
      environment-image="neutral"
      loading="eager"
      reveal="auto"
      style="width: 100%; height: 400px;">
  </model-viewer>

  <button onclick="triggerAR('model2')"><strong>Play AR</strong></button>
</div>

<!-- Model 3 -->
<div class="ar-section">
  <div class="head-title"><strong>block</strong></div>
  <div class="sub-title">Concept design from mesh</div>

<model-viewer
      id="model1"
      src="AR.glb"
      ios-src="AR.usdz"
      ar
      ar-modes="scene-viewer webxr quick-look"
      camera-controls
      autoplay
      auto-rotate
      shadow-intensity="1"
      shadow-softness="1"
      environment-image="neutral"
      loading="eager"
      reveal="auto"
      style="width: 100%; height: 400px;">
  </model-viewer>

 <button class="ar-button" onclick="triggerAR('model1')">
    Play AR
  </button>
</div>

<footer>
  <div class="footer-link">
    <strong>Facebook:</strong>
    <a href="https://www.facebook.com" target="_blank">
      Facebook Page
    </a>
  </div>
</footer>

<!-- Load model-viewer -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<script>
function triggerAR(id) {
  const viewer = document.getElementById(id);

  if (!viewer) return;

  if (viewer.canActivateAR) {
    viewer.activateAR().catch((error) => {
      alert("AR ไม่พร้อมบนอุปกรณ์นี้\nลองกดปุ่ม AR บนมุมขวาของโมเดลแทน");
      console.warn("activateAR failed:", error);
    });
  } else {
    alert("อุปกรณ์หรือ browser นี้ไม่รองรับ AR");
  }
}
</script>

</body>
</html>
