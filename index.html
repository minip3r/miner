<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>MINIP3R</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header>
  <div class="main-title"><strong>MINIP3R</strong></div>
  <div class="sub-title"><strong>3D MODEL (AR)</strong></div>
</header>

<!-- Model 1 -->
<div class="ar-section">
  <div class="head-title"><strong>Qynn</strong></div>
  <div class="sub-title">original character from minip3r</div>

  <model-viewer
    id="model1"
    src="2677.glb"
    ios-src="2677.usdz"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    autoplay
    auto-rotate
    environment-image="neutral.hdr"
    style="width: 100%; height: 400px;">
  </model-viewer>

  <button onclick="triggerAR('model1')"><strong>Play AR</strong></button>
</div>

<!-- Model 2 -->
<div class="ar-section">
  <div class="head-title"><strong>MINIP3R</strong></div>
  <div class="sub-title">original character from minip3r</div>

  <model-viewer 
    id="model2"
    src="01.glb"
    ios-src="01.usdz"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    autoplay
    auto-rotate
    environment-image="neutral.hdr"
    style="width: 100%; height: 400px;">
  </model-viewer>

  <button onclick="triggerAR('model2')"><strong>Play AR</strong></button>
</div>

<!-- Model 3 -->
<div class="ar-section">
  <div class="head-title"><strong>block</strong></div>
  <div class="sub-title">Concept design from mesh</div>

  <model-viewer 
    id="model3"
    src="AR.glb"
    ios-src="AR.usdz"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    autoplay
    auto-rotate
    environment-image="neutral.hdr"
    style="width: 100%; height: 400px;">
  </model-viewer>

  <button onclick="triggerAR('model3')"><strong>Play AR</strong></button>
</div>

<footer>
  <div class="footer-link">
    <strong>Facebook:</strong>
    <a href="https://www.facebook.com" target="_blank">facebook.com</a>
  </div>
</footer>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<script>
function triggerAR(id) {
  const viewer = document.getElementById(id);
  if (!viewer) return;

  viewer.activateAR().catch((error) => {
    alert("AR ไม่พร้อมบนอุปกรณ์นี้");
    console.warn(error);
  });
}
</script>

</body>
</html>
